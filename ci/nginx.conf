# The upstream project publishes its web image for arm64 only, so it cannot run on
# the amd64 GitHub-hosted runners. This is the same job done by a stock nginx:
# serve Laravel's public/ from the shared code volume and hand .php to php-fpm.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.ht {
        deny all;
    }
}
