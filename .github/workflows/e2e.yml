name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs against an application the pipeline boots itself (docker-compose.ci.yml).
# The public demo instance is behind Cloudflare, which challenges datacentre IPs:
# browser traffic from GitHub-hosted runners gets a 403 and the app's XHR calls fail
# silently, so a suite pointed at it would be red for reasons that have nothing to do
# with the code. Local runs still default to the public instance.
env:
  UI_BASE_URL: http://localhost:4200
  API_BASE_URL: http://localhost:8091

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/app-stack
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-api
          path: playwright-report/
          retention-days: 7

  ui:
    name: UI (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}
      - uses: ./.github/actions/app-stack
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/app-stack
      # Baselines are per-platform. Missing ones are written and uploaded for review
      # rather than failing the job; committed ones are compared as usual.
      - run: npx playwright test --project=visual --update-snapshots=missing
      - name: Upload snapshots and diffs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-snapshots
          path: |
            tests/visual/**/*-snapshots/**
            test-results/
            playwright-report/
          retention-days: 7
