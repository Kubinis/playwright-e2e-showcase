name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The target is a live third-party demo instance; a nightly run tells us the
    # suite broke because the site changed, not because someone pushed code.
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-api
          path: playwright-report/
          retention-days: 7

  ui:
    name: UI (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the official image so screenshots are rendered by the same fonts
    # and the same browser build every time — the only way pixel baselines stay
    # meaningful across machines.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Baselines are per-platform. Missing ones are written and uploaded for a
      # human to review and commit; existing ones are compared as usual.
      - run: npx playwright test --project=visual --update-snapshots=missing
      - name: Upload snapshots and diffs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-snapshots
          path: |
            tests/visual/**/*-snapshots/**
            test-results/
            playwright-report/
          retention-days: 7
